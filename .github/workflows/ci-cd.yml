# CI: tests on every push and pull request.
# CD: a push to main that passes the tests is built in Azure Container Registry,
# then the chat API (trailerplace-api) and the hourly follow-up job
# (trailerplace-followup) are both pointed at the new image. Only the image
# changes; secrets and settings stay as they are on Azure.
# Database migrations are NOT run here: apply them by hand (alembic upgrade head)
# before merging a change that needs one.
# Afterwards the azure branch is moved to the deployed commit.
name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  AZURE_CLIENT_ID: 06a190de-9356-4d87-a7b8-7e3b7fe8f882   # managed identity trailerplace-github-deploy (OIDC, no secret)
  AZURE_TENANT_ID: 6f91c1ac-d84c-4dbc-a2a5-c000cdd0e8c8
  AZURE_SUBSCRIPTION_ID: 2a963ce0-7297-4be6-9ed9-a68eda72d385
  RESOURCE_GROUP: TrailerPlace-Resource
  REGISTRY: TrailerPlaceBackend
  REGISTRY_SERVER: trailerplacebackend-crhuewcedpbre8fz.azurecr.io
  IMAGE: trailerplace-api
  APP: trailerplace-api
  FOLLOWUP_JOB: trailerplace-followup

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The OpenAI client is built when the graph is; no test calls the API.
      OPENAI_API_KEY: sk-ci-placeholder-never-used
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --frozen --python 3.12
      - name: Run tests
        run: uv run --frozen pytest -q

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      id-token: write   # OIDC sign-in to Azure
      contents: write   # move the azure branch
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}
      - name: Build the image in Azure
        run: |
          TAG="${GITHUB_SHA::7}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          az acr build --registry "$REGISTRY" --image "$IMAGE:$TAG" --file Dockerfile.backend .
      - name: Point the chat API at the new image
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt
          az containerapp update --name "$APP" --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY_SERVER/$IMAGE:$TAG" \
            --query "properties.latestRevisionName" -o tsv
      - name: Point the follow-up job at the new image
        run: |
          az containerapp job update --name "$FOLLOWUP_JOB" --resource-group "$RESOURCE_GROUP" \
            --image "$REGISTRY_SERVER/$IMAGE:$TAG" \
            --query "properties.template.containers[0].image" -o tsv
      - name: Move the azure branch to the deployed commit
        run: git push --force origin HEAD:refs/heads/azure
      - name: Summary
        run: echo "Deployed \`$IMAGE:$TAG\` to \`$APP\` and \`$FOLLOWUP_JOB\`." >> "$GITHUB_STEP_SUMMARY"
